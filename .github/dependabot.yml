# Weekly dependency update PRs; CI runs the full test suite on each one.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: semiannually
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: terraform
    directory: /aws
    schedule:
      interval: monthly
