name: 3D traffic simulation

on:
  push:
    branches: [main]
    paths:
      - sim3d.py
      - routing_sim.py
      - fetch_network.py
      - viewer/**
      - tests/test_viewer_smoke.py
      - requirements.txt
      - .github/workflows/sim3d.yml
  pull_request:
    paths:
      - sim3d.py
      - routing_sim.py
      - fetch_network.py
      - viewer/**
      - tests/test_viewer_smoke.py
      - requirements.txt
      - .github/workflows/sim3d.yml
  workflow_dispatch:
    inputs:
      trips:
        description: PCU departing 07:00-10:00
        default: "60000"
      pcu_per_agent:
        description: PCU each simulated vehicle stands for
        default: "5"
      show:
        description: Vehicles animated in the viewer
        default: "3000"
      seed:
        description: Random seed for demand
        default: "7"

permissions:
  contents: read

concurrency:
  group: sim3d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore road network
        id: network
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/orr_network.graphml
          key: orr-network-${{ hashFiles('fetch_network.py') }}

      - name: Download road network from OpenStreetMap
        if: steps.network.outputs.cache-hit != 'true'
        run: mkdir -p data && python fetch_network.py

      - name: Simulate
        env:
          TRIPS: ${{ inputs.trips || '60000' }}
          PCU_PER_AGENT: ${{ inputs.pcu_per_agent || '5' }}
          SHOW: ${{ inputs.show || '3000' }}
          SEED: ${{ inputs.seed || '7' }}
        run: |
          python sim3d.py --trips "$TRIPS" --pcu-per-agent "$PCU_PER_AGENT" --show "$SHOW" --seed "$SEED"
          cat output/sim3d/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test the viewer
        run: |
          pip install "playwright>=1.48,<2" "pytest>=8,<10"
          python -m playwright install --with-deps chromium
          pytest -m browser tests/test_viewer_smoke.py -p no:cacheprovider

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orr-3d-viewer
          path: output/sim3d
          retention-days: 30

      - name: Upload Pages artifact
        if: vars.DEPLOY_PAGES == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: output/sim3d

  deploy:
    needs: simulate
    if: vars.DEPLOY_PAGES == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
